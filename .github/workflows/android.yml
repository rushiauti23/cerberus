name: Build

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: gradle/actions/setup-gradle@v4

      - name: Test the vault core
        run: ./gradlew :core:test

      # Optional: sign with your own key so new builds install over old ones.
      # Add the four TIJORI_* secrets described in the README to turn this on.
      - name: Prepare the signing key
        env:
          KEYSTORE_BASE64: ${{ secrets.TIJORI_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/tijori.jks"
            echo "TIJORI_KEYSTORE_FILE=$RUNNER_TEMP/tijori.jks" >> "$GITHUB_ENV"
            echo "Signing with your key."
          else
            echo "No signing key configured; the APK is signed with a throwaway debug key."
          fi

      - name: Build the release APK
        env:
          TIJORI_KEYSTORE_PASSWORD: ${{ secrets.TIJORI_KEYSTORE_PASSWORD }}
          TIJORI_KEY_ALIAS: ${{ secrets.TIJORI_KEY_ALIAS }}
          TIJORI_KEY_PASSWORD: ${{ secrets.TIJORI_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease

      - name: Show APK size
        run: ls -lh app/build/outputs/apk/release/

      - uses: actions/upload-artifact@v4
        with:
          name: tijori-release-apk
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
